{{ $enabledPostNavigation := .Site.Params.postNavigation | default true }}
{{ if $enabledPostNavigation }}
<div class="navigation navigation-single">
    {{ with .PrevInSection }}
    <a href="{{ .RelPermalink }}" class="navigation-prev h-entry">
      {{ partial "icons/chevron-left.svg" . }}
      <span class="navigation-tittle p-name">{{ .Title }}</span>
    </a>
    {{ end }}
    {{ with .NextInSection }}
    <a href="{{ .RelPermalink }}" class="navigation-next h-entry">
      <span class="navigation-tittle p-name">{{ .Title }}</span>
      {{ partial "icons/chevron-right.svg" . }}
    </a>
    {{ end }}
</div>
{{ end }}
